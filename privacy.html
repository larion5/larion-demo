  <div id="page-loading" role="status" hidden>Сайт загружается…</div>
  <style>
    #page-loading:not([hidden]) { position: fixed; z-index: 9999; inset: auto 16px 16px auto; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 12px; background: #31382c; color: white; font: 15px/1.5 system-ui, sans-serif; }
  </style>
  <script>
    (function () {
      var status = document.getElementById('page-loading');
      var timer = setTimeout(function () { status.hidden = false; }, 650);
      var slow = setTimeout(function () { status.textContent = 'Сайт всё ещё загружается…'; }, 8000);
      window.addEventListener('load', function () {
        clearTimeout(timer);
        clearTimeout(slow);
        status.hidden = true;
      }, { once: true });
    })();
  </script>
