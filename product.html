<!doctype html>
<html lang="ru">
<head><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'self'; object-src 'none'"><link rel="stylesheet" href="css/demo.css?v=checkout6"><script src="js/demo.js?v=orders1"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#31382c">
  <title>Товар | larion</title>
  <link rel="stylesheet" href="css/style.css?v=checkout2">
</head>
<body>
  <div id="page-loading" role="status" hidden>Сайт загружается…</div>
  <style>
    #page-loading:not([hidden]) { position: fixed; z-index: 9999; inset: auto 16px 16px auto; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 12px; background: #31382c; color: white; font: 15px/1.5 system-ui, sans-serif; }
  </style>
  <script>
    (function () {
      var status = document.getElementById('page-loading');
      var timer = setTimeout(function () { status.hidden = false; }, 650);
      var slow = setTimeout(function () { status.textContent = 'Сайт всё ещё загружается…'; }, 8000);
      window.addEventListener('load', function () {
        clearTimeout(timer);
        clearTimeout(slow);
        status.hidden = true;
      }, { once: true });
    })();
  </script>

  <div id="site-header"></div>

  <main class="page">
    <nav class="crumbs crumbs--product" data-product-crumbs aria-label="Хлебные крошки"></nav>
    <section class="product" data-product></section>
    <section class="related" data-related hidden>
      <h2>Смотри, что ещё есть</h2>
      <div class="carousel">
        <div class="carousel__track" data-track></div>
        <button class="arrow arrow--prev carousel__prev" type="button" data-carousel-prev aria-label="Назад"></button>
        <button class="arrow carousel__next" type="button" data-carousel-next aria-label="Дальше"></button>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="data/catalog.js?v=mobile5"></script>
  <script src="data/photo-focus.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/layout.js?v=checkout6"></script>
  <script src="js/lightbox.js?v=orders1"></script>
  <script src="js/sheet.js?v=checkout6"></script>
</body>
</html>
