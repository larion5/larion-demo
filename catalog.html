<!doctype html>
<html lang="ru">
<head><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'self'; object-src 'none'"><link rel="stylesheet" href="css/demo.css?v=checkout5"><script src="js/demo.js?v=orders1"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#31382c">
  <title>Каталог | Larion</title>
  <link rel="stylesheet" href="css/style.css?v=checkout2">
</head>
<body>
  <div id="page-loading" role="status" hidden>Сайт загружается…</div>
  <style>
    #page-loading:not([hidden]) { position: fixed; z-index: 9999; inset: auto 16px 16px auto; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 12px; background: #31382c; color: white; font: 15px/1.5 system-ui, sans-serif; }
  </style>
  <script>
    (function () {
      var status = document.getElementById('page-loading');
      var timer = setTimeout(function () { status.hidden = false; }, 650);
      var slow = setTimeout(function () { status.textContent = 'Сайт всё ещё загружается…'; }, 8000);
      window.addEventListener('load', function () {
        clearTimeout(timer);
        clearTimeout(slow);
        status.hidden = true;
      }, { once: true });
    })();
  </script>

  <div id="site-header"></div>

  <main class="page">
    <div class="catalog-head"><h1 class="title">Каталог</h1></div>
    <nav class="cats" data-cats aria-label="Категории"></nav>
    <nav class="crumbs" data-crumbs aria-label="Хлебные крошки"></nav>
    <div class="toolbar">
      <p class="cat-descr" data-cat-descr hidden></p>
      <input type="search" data-search placeholder="Поиск" aria-label="Поиск по каталогу">
      <select data-sort aria-label="Сортировка">
        <option value="default">По умолчанию</option>
        <option value="price-asc">Цена: по возрастанию</option>
        <option value="price-desc">Цена: по убыванию</option>
        <option value="name-asc">Название: А—Я</option>
        <option value="name-desc">Название: Я—А</option>
        <option value="newest">Сперва новые</option>
        <option value="oldest">Сперва старые</option>
      </select>
    </div>
    <div class="products" data-catalog></div>
    <p class="empty" data-search-empty hidden>Ничего не нашлось</p>
    <div class="availability-note" data-stock-empty hidden>
      <img src="assets/img/home/frog-in-water.webp" width="960" height="1280" alt="Жабка выглядывает из воды" loading="lazy" decoding="async">
      <p>Здесь пока нет наличия. Следите за <a href="https://t.me/larionart5">телеграмм-каналом</a>, там выложу, когда будет дроп.</p>
    </div>
    <div class="load-more" data-load-more hidden><button class="btn btn--outline" type="button">Загрузить ещё</button></div>

    <section class="catalog-preorder">
      <p>Нет нужной жабки в&nbsp;наличии? Оформите предзаказ! Выберите дизайн, окрас и&nbsp;мордочку жабки из&nbsp;каталога предзаказа</p>
      <a class="btn" href="#" data-todo>Собрать свою жабку</a>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="data/catalog.js?v=mobile5"></script>
  <script src="data/photo-focus.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/layout.js?v=checkout2"></script>
  <script src="js/photo-placeholders.js?v=1"></script>
  <script src="js/sheet.js?v=checkout5"></script>
</body>
</html>
