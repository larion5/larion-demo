<!doctype html>
<html lang="ru">
<head><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'self'; object-src 'none'"><link rel="stylesheet" href="css/demo.css?v=checkout5"><script src="js/demo.js?v=orders1"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#31382c">
  <title>Конструктор жабагочи | Larion</title>
  <meta name="description" content="Выберите жабагочи и примерьте на неё шляпы и коврики.">
  <link rel="stylesheet" href="css/style.css?v=checkout2">
  <link rel="stylesheet" href="css/constructor.css?v=checkout2">
</head>
<body data-page-script="js/constructor.js?v=orders1">
  <div id="page-loading" role="status" hidden>Сайт загружается…</div>
  <style>
    #page-loading:not([hidden]) { position: fixed; z-index: 9999; inset: auto 16px 16px auto; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 12px; background: #31382c; color: white; font: 15px/1.5 system-ui, sans-serif; }
  </style>
  <script>
    (function () {
      var status = document.getElementById('page-loading');
      var timer = setTimeout(function () { status.hidden = false; }, 650);
      var slow = setTimeout(function () { status.textContent = 'Сайт всё ещё загружается…'; }, 8000);
      window.addEventListener('load', function () {
        clearTimeout(timer);
        clearTimeout(slow);
        status.hidden = true;
      }, { once: true });
    })();
  </script>

  <div id="site-header"></div>

  <main class="page">
    <div class="builder-head">
      <h1 class="title">Конструктор</h1>
    </div>
    <template id="builder-empty">
      <section class="builder-empty">
        <img src="assets/img/home/frog-in-water.webp" width="960" height="1280" alt="Жабка выглядывает из воды">
        <div>
          <h2 class="subtitle">Жабагочи разобрали</h2>
          <p>Как только появятся новые, здесь снова можно будет собрать набор.</p>
          <a class="btn" href="catalog.html">А что в наличии?</a>
        </div>
      </section>
    </template>

    <section class="builder" data-constructor>
      <p class="builder__hint">Соберите свою жабку: тяните вбок шляпу, жабагочи или коврик, и они будут сменяться по кругу.</p>
      <div class="builder__main">
        <div class="stage" data-stage>
          <div class="band band--mat" data-band="mat"></div>
          <div class="stage__shadow" data-layer="shadow"></div>
          <div class="band band--frog" data-band="frog"></div>
          <div class="band band--hat" data-band="hat"></div>
          <button class="stage__random" type="button" data-random><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" stroke="currentColor" stroke-width="1.8"/><circle cx="8.8" cy="8.8" r="1.5" fill="currentColor"/><circle cx="15.2" cy="8.8" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="8.8" cy="15.2" r="1.5" fill="currentColor"/><circle cx="15.2" cy="15.2" r="1.5" fill="currentColor"/></svg>Случайная комбинация</button>
          <button class="arrow arrow--prev stage__arrow stage__arrow--left stage__arrow--hat" type="button" data-kind="hat" data-step="-1" aria-label="Предыдущая позиция: шляпа"></button>
          <button class="arrow stage__arrow stage__arrow--right stage__arrow--hat" type="button" data-kind="hat" data-step="1" aria-label="Следующая позиция: шляпа"></button>
          <button class="arrow arrow--prev stage__arrow stage__arrow--left stage__arrow--frog" type="button" data-kind="frog" data-step="-1" aria-label="Предыдущая позиция: жабагочи"></button>
          <button class="arrow stage__arrow stage__arrow--right stage__arrow--frog" type="button" data-kind="frog" data-step="1" aria-label="Следующая позиция: жабагочи"></button>
          <button class="arrow arrow--prev stage__arrow stage__arrow--left stage__arrow--mat" type="button" data-kind="mat" data-step="-1" aria-label="Предыдущая позиция: коврик"></button>
          <button class="arrow stage__arrow stage__arrow--right stage__arrow--mat" type="button" data-kind="mat" data-step="1" aria-label="Следующая позиция: коврик"></button>
        </div>
      </div>

      <aside class="builder__side">
        <div class="set">
          <ul data-summary></ul>
          <div class="set__total"><span>Итого</span><span class="price" data-total></span></div>
          <button class="btn" type="button" data-add-set>Добавить набор в корзину</button>
          <div class="set__more" data-set-more hidden>
            <p class="set__more-title">Ещё шляпку? 🎩</p>
            <p>Шляп и ковриков можно взять несколько: покрутите шляпу или коврик и нажмите кнопку выше. Набор уже в корзине.</p>
          </div>
          <p class="set__note" data-set-note hidden></p>
        </div>
      </aside>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="data/catalog.js?v=mobile5"></script>
  <script src="data/constructor.js"></script>
  <script src="data/photo-focus.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/layout.js?v=checkout2"></script>
  <script src="js/lightbox.js?v=orders1"></script>
  <script src="js/sheet.js?v=checkout5"></script>
</body>
</html>
